<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>상품 집계</title>

<script async
src="https://docs.opencv.org/4.x/opencv.js"></script>

<script
src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

:root{
    --bg:#f7f5ef;
    --card:#ffffff;
    --main:#928461;
    --sub:#b5a98a;
    --light:#e7e0d0;
    --text:#2b2b2b;
}

body{
    margin:0;
    padding:14px;
    background:var(--bg);
    font-family:Arial,sans-serif;
    color:var(--text);
}

.container{
    max-width:920px;
    margin:auto;
    background:var(--card);
    border-radius:24px;
    padding:18px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    font-size:22px;
    margin-bottom:18px;
    color:var(--main);
}

h3{
    font-size:14px;
    margin-top:18px;
    color:#555;
}

.cameraWrap{
    position:relative;
}

video,img{
    width:100%;
    border-radius:18px;
    margin-top:8px;
    background:#ddd;
}

.cameraOff{

    width:100%;
    aspect-ratio:16/9;

    background:#ece7dc;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-top:8px;
}

.cameraIcon{

    width:110px;
    opacity:0.9;
}

button{
    width:100%;
    padding:11px;
    border:none;
    border-radius:14px;
    background:var(--light);
    color:var(--text);
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    opacity:0.92;
}

.row{
    display:flex;
    gap:8px;
}

.smallBtn{
    flex:1;
}

input[type=file]{
    width:100%;
    padding:10px;
    border:none;
    border-radius:14px;
    background:#f2efe7;
    box-sizing:border-box;
}

.excludeWrap{
    display:flex;
    gap:8px;
    align-items:stretch;
}

.excludeBox{

    flex:1;
    height:180px;
    overflow-y:auto;
    background:#f5f2eb;
    border-radius:16px;
    padding:10px;
}

.excludeBox textarea{
    width:100%;
    height:400px;
    border:none;
    background:transparent;
    resize:none;
    outline:none;
    color:#333;
    font-size:14px;
    line-height:1.8;
}

.scrollBtns{
    width:55px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.scrollBtn{
    flex:1;
    background:var(--sub);
    color:white;
    font-size:18px;
}

.status{
    margin-top:12px;
    color:#666;
    font-size:14px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:18px;
    overflow:hidden;
    border-radius:18px;
}

th{
    background:var(--main);
    color:white;
    padding:10px;
    font-size:14px;
}

td{
    background:#faf8f3;
    padding:8px;
    text-align:center;
    border-bottom:1px solid #ece7dc;
}

.editInput{
    width:95%;
    padding:7px;
    border:none;
    border-radius:10px;
    background:white;
    color:#222;
    box-sizing:border-box;
}

canvas{
    display:none;
}

.hidden{
    display:none;
}

</style>
</head>

<body>

<div class="container">

<h1>상품 집계</h1>

<h3>카메라</h3>

<div class="cameraWrap">

<div class="cameraOff"
id="cameraPlaceholder">

<img
class="cameraIcon"

src="https://upload.wikimedia.org/wikipedia/commons/9/90/DaVinci_Resolve_Studio.png">

</div>

<video id="video"
autoplay
playsinline
class="hidden"></video>

</div>

<div class="row">

<button class="smallBtn"
onclick="startCamera()">
카메라 켜기
</button>

<button class="smallBtn"
onclick="stopCamera()">
카메라 끄기
</button>

</div>

<button onclick="capturePhoto()">
사진 촬영
</button>

<canvas id="canvas"></canvas>

<img id="preview">

<h3>사진 업로드</h3>

<input type="file"
id="imageInput"
multiple
accept="image/*">

<h3>제외 문자</h3>

<div class="excludeWrap">

<div class="excludeBox"
id="excludeScroll">

<textarea id="excludeWords">※
부가세
택배비
M+</textarea>

</div>

<div class="scrollBtns">

<button class="scrollBtn"
onclick="scrollExclude(-80)">
▲
</button>

<button class="scrollBtn"
onclick="scrollExclude(80)">
▼
</button>

</div>

</div>

<button onclick="startOCR()">
OCR 시작
</button>

<div class="status"
id="status"></div>

<table id="resultTable">

<thead>
<tr>
<th>품명</th>
<th>색상</th>
<th>사이즈</th>
<th>수량</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const COLORS = [
'블랙','화이트','그레이',
'차콜','네이비','핑크',
'레드','카키','브라운',
'베이지','아이보리'
];

const SIZES = [
'FREE','XS','S','M','L',
'XL','XXL','90','95',
'100','105','110',
'230','235','240',
'245','250','255',
'260','265','270'
];

let capturedImages = [];
let currentStream = null;

async function startCamera(){

    try{

        currentStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:{
                    facingMode:'environment',

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    }
                }
            });

        document
            .getElementById('video')
            .srcObject = currentStream;

        document
            .getElementById('video')
            .classList
            .remove('hidden');

        document
            .getElementById('cameraPlaceholder')
            .classList
            .add('hidden');

    }catch(e){

        alert('카메라 실패');
    }
}

function stopCamera(){

    if(currentStream){

        currentStream
            .getTracks()
            .forEach(track=>track.stop());

        document
            .getElementById('video')
            .srcObject = null;

        document
            .getElementById('video')
            .classList
            .add('hidden');

        document
            .getElementById('cameraPlaceholder')
            .classList
            .remove('hidden');
    }
}

function capturePhoto(){

    const video =
        document
        .getElementById('video');

    if(!video.srcObject){

        alert('카메라 먼저 켜주세요');
        return;
    }

    const canvas =
        document
        .getElementById('canvas');

    const ctx =
        canvas.getContext('2d');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0);

    const data =
        canvas.toDataURL(
            'image/jpeg',
            1.0
        );

    capturedImages.push(data);

    document
        .getElementById('preview')
        .src = data;
}

function scrollExclude(amount){

    document
        .getElementById('excludeScroll')
        .scrollBy({
            top:amount,
            behavior:'smooth'
        });
}

function shouldExclude(text,rules){

    return rules.some(rule=>{

        return rule.trim() &&
            text.includes(rule.trim());
    });
}

function detectColor(text){

    for(const c of COLORS){

        if(text.includes(c)){
            return c;
        }
    }

    return '';
}

function detectSize(text){

    for(const s of SIZES){

        if(
            text.includes(` ${s} `) ||
            text.endsWith(` ${s}`) ||
            text.startsWith(`${s} `)
        ){
            return s;
        }
    }

    return '';
}

function detectQuantity(text){

    if(/-\d+$/.test(text)){
        return 0;
    }

    const match =
        text.match(/(\d+)$/);

    if(match){
        return parseInt(match[1]);
    }

    return 1;
}

function extractProductName(
    text,
    color,
    size
){

    let name = text;

    if(color){
        name = name.replace(color,'');
    }

    if(size){
        name = name.replace(size,'');
    }

    name = name.replace(/-?\d+$/,'');

    name = name.replace(
        /\s+/g,
        ' '
    );

    return name.trim();
}

function preprocessImage(img){

    const canvas =
        document.createElement('canvas');

    const ctx =
        canvas.getContext('2d');

    const scale = 1.5;

    canvas.width =
        img.width * scale;

    canvas.height =
        img.height * scale;

    ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
    );

    let src =
        cv.imread(canvas);

    let gray =
        new cv.Mat();

    let blur =
        new cv.Mat();

    let thresh =
        new cv.Mat();

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );

    cv.GaussianBlur(
        gray,
        blur,
        new cv.Size(3,3),
        0
    );

    cv.adaptiveThreshold(
        blur,
        thresh,
        255,
        cv.ADAPTIVE_THRESH_GAUSSIAN_C,
        cv.THRESH_BINARY,
        31,
        15
    );

    cv.imshow(canvas,thresh);

    src.delete();
    gray.delete();
    blur.delete();
    thresh.delete();

    return canvas;
}

async function runOCR(
    imageSource,
    resultMap,
    excludeRules
){

    return new Promise((resolve)=>{

        const img = new Image();

        img.onload = async ()=>{

            const processed =
                preprocessImage(img);

            const result =
                await Tesseract
                .recognize(

                    processed,

                    'kor+eng',

                    {
                        tessedit_pageseg_mode:6,

                        logger:m=>{}
                    }
                );

            const text =
                result.data.text;

            const lines =
                text.split('\n');

            for(let rawLine of lines){

                let line =
                    rawLine.trim();

                if(line.length < 2){
                    continue;
                }

                if(
                    shouldExclude(
                        line,
                        excludeRules
                    )
                ){
                    continue;
                }

                const quantity =
                    detectQuantity(line);

                if(quantity === 0){
                    continue;
                }

                const color =
                    detectColor(line);

                const size =
                    detectSize(line);

                const productName =
                    extractProductName(
                        line,
                        color,
                        size
                    );

                if(productName.length < 2){
                    continue;
                }

                const key =
                    `${productName}|${color}|${size}`;

                if(!resultMap[key]){

                    resultMap[key] = {

                        name:productName,
                        color,
                        size,
                        quantity:0
                    };
                }

                resultMap[key]
                    .quantity += quantity;
            }

            resolve();
        };

        img.src = imageSource;
    });
}

async function startOCR(){

    const status =
        document
        .getElementById('status');

    const excludeRules =
        document
        .getElementById('excludeWords')
        .value
        .split('\n');

    const resultMap = {};

    const files =
        document
        .getElementById('imageInput')
        .files;

    let total =
        capturedImages.length +
        files.length;

    let current = 1;

    for(const image of capturedImages){

        status.innerText =
            `OCR ${current}/${total}`;

        await runOCR(
            image,
            resultMap,
            excludeRules
        );

        current++;
    }

    for(const file of files){

        status.innerText =
            `OCR ${current}/${total}`;

        const imageURL =
            URL.createObjectURL(file);

        await runOCR(
            imageURL,
            resultMap,
            excludeRules
        );

        current++;
    }

    renderTable(resultMap);

    status.innerText = '완료';
}

function renderTable(data){

    const tbody =
        document.querySelector(
            '#resultTable tbody'
        );

    tbody.innerHTML = '';

    Object.values(data)
    .forEach(item=>{

        const tr =
            document
            .createElement('tr');

        tr.innerHTML = `

        <td>
        <input class="editInput"
        value="${item.name}">
        </td>

        <td>
        <input class="editInput"
        value="${item.color}">
        </td>

        <td>
        <input class="editInput"
        value="${item.size}">
        </td>

        <td>
        <input class="editInput"
        value="${item.quantity}">
        </td>
        `;

        tbody.appendChild(tr);
    });
}

</script>

</body>
</html>
