<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>상품 집계</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
    margin:0;
    padding:14px;
    background:#f6f7fb;
    font-family:Arial,sans-serif;
    color:#222;
}

.container{
    max-width:920px;
    margin:auto;
    background:white;
    border-radius:22px;
    padding:18px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    font-size:22px;
    margin-bottom:18px;
    color:#444;
}

h3{
    font-size:15px;
    margin-top:18px;
    color:#666;
}

video,img{
    width:100%;
    border-radius:16px;
    margin-top:8px;
}

input[type=file]{
    width:100%;
    padding:10px;
    border:none;
    border-radius:14px;
    background:#eef2ff;
    color:#333;
    box-sizing:border-box;
}

textarea{
    width:100%;
    min-height:110px;
    margin-top:8px;
    padding:12px;
    border:none;
    border-radius:16px;
    background:#f3f4f6;
    color:#222;
    font-size:14px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:11px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    background:#c7d2fe;
    color:#222;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    opacity:0.9;
}

.rowBtns{
    display:flex;
    gap:8px;
}

.smallBtn{
    flex:1;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:18px;
    overflow:hidden;
    border-radius:16px;
}

th{
    background:#ddd6fe;
    color:#333;
    padding:10px;
    font-size:14px;
}

td{
    background:#fafafa;
    padding:8px;
    text-align:center;
    border-bottom:1px solid #eee;
}

.editInput{
    width:95%;
    padding:7px;
    border:none;
    border-radius:10px;
    background:#f1f5f9;
    color:#222;
}

.status{
    margin-top:10px;
    color:#666;
    font-size:14px;
    font-weight:bold;
}

.rawBox{
    background:#f8fafc;
    padding:12px;
    border-radius:14px;
    margin-top:10px;
    white-space:pre-wrap;
    max-height:220px;
    overflow:auto;
    font-size:13px;
}

canvas{
    display:none;
}

.excludeRow{
    display:flex;
    gap:8px;
    align-items:stretch;
}

.sideBtns{
    width:54px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.arrowBtn{
    flex:1;
    font-size:18px;
    background:#fde68a;
}

</style>
</head>

<body>

<div class="container">

<h1>상품 집계</h1>

<h3>카메라</h3>

<video id="video" autoplay playsinline></video>

<div class="rowBtns">

<button class="smallBtn" onclick="startCamera()">
카메라 켜기
</button>

<button class="smallBtn" onclick="stopCamera()">
카메라 끄기
</button>

</div>

<button onclick="capturePhoto()">
사진 촬영
</button>

<canvas id="canvas"></canvas>

<img id="preview">

<h3>사진 업로드</h3>

<input type="file"
id="imageInput"
multiple
accept="image/*">

<h3>제외 문자</h3>

<div class="excludeRow">

<textarea id="excludeWords">※
부가세
택배비
M+</textarea>

<div class="sideBtns">

<button class="arrowBtn"
onclick="moveExcludeUp()">
↑
</button>

<button class="arrowBtn"
onclick="moveExcludeDown()">
↓
</button>

</div>

</div>

<button onclick="startOCR()">
OCR 시작
</button>

<div class="status" id="status"></div>

<h3>OCR 결과</h3>

<div class="rawBox" id="rawText"></div>

<table id="resultTable">

<thead>
<tr>
<th>품명</th>
<th>색상</th>
<th>사이즈</th>
<th>수량</th>
</tr>
</thead>

<tbody></tbody>

</table>

<h3>복사용 결과</h3>

<textarea id="copyText"></textarea>

<button onclick="copyResult()">
결과 복사
</button>

</div>

<script>

const COLORS = [
'블랙','화이트','그레이','차콜',
'네이비','핑크','레드','카키',
'브라운','베이지','아이보리'
];

const SIZES = [
'FREE','XS','S','M','L','XL',
'90','95','100','105','110',
'230','235','240','245','250',
'255','260','265','270'
];

let capturedImages = [];
let currentStream = null;

async function startCamera(){

    try{

        currentStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:'environment',
                    width:{ideal:1280},
                    height:{ideal:720}
                }
            });

        document.getElementById('video')
            .srcObject = currentStream;

    }catch(e){

        alert('카메라 실패');
    }
}

function stopCamera(){

    if(currentStream){

        currentStream
            .getTracks()
            .forEach(track=>track.stop());

        document.getElementById('video')
            .srcObject = null;
    }
}

function capturePhoto(){

    const video =
        document.getElementById('video');

    if(!video.srcObject){
        alert('카메라 먼저 켜주세요');
        return;
    }

    const canvas =
        document.getElementById('canvas');

    const ctx =
        canvas.getContext('2d');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0);

    const data =
        canvas.toDataURL(
            'image/jpeg',
            0.75
        );

    capturedImages.push(data);

    document.getElementById('preview')
        .src = data;
}

function moveExcludeUp(){

    const textarea =
        document.getElementById('excludeWords');

    const lines =
        textarea.value.split('\n');

    if(lines.length > 1){

        lines.push(lines.shift());

        textarea.value =
            lines.join('\n');
    }
}

function moveExcludeDown(){

    const textarea =
        document.getElementById('excludeWords');

    const lines =
        textarea.value.split('\n');

    if(lines.length > 1){

        lines.unshift(lines.pop());

        textarea.value =
            lines.join('\n');
    }
}

function shouldExclude(text,rules){

    return rules.some(rule=>{

        return rule.trim() &&
            text.includes(rule.trim());
    });
}

function detectColor(text){

    for(const c of COLORS){

        if(text.includes(c)){
            return c;
        }
    }

    return '';
}

function detectSize(text){

    for(const s of SIZES){

        if(text.includes(s)){
            return s;
        }
    }

    return '';
}

function detectQuantity(text){

    if(/-\d+$/.test(text)){
        return 0;
    }

    const match =
        text.match(/(\d+)$/);

    if(match){
        return parseInt(match[1]);
    }

    return 1;
}

function extractProductName(text,color,size){

    let name = text;

    if(color){
        name = name.replace(color,'');
    }

    if(size){
        name = name.replace(size,'');
    }

    name = name.replace(/-?\d+$/,'');
    name = name.replace(/\s+/g,' ');

    return name.trim();
}

function preprocessImage(imgElement){

    const canvas =
        document.createElement('canvas');

    const ctx =
        canvas.getContext('2d');

    const scale = 0.6;

    canvas.width =
        imgElement.width * scale;

    canvas.height =
        imgElement.height * scale;

    ctx.drawImage(
        imgElement,
        0,
        0,
        canvas.width,
        canvas.height
    );

    let src = cv.imread(canvas);

    let gray = new cv.Mat();
    let thresh = new cv.Mat();

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );

    cv.threshold(
        gray,
        thresh,
        150,
        255,
        cv.THRESH_BINARY
    );

    cv.imshow(canvas,thresh);

    src.delete();
    gray.delete();
    thresh.delete();

    return canvas;
}

async function runOCR(
    imageSource,
    resultMap,
    excludeRules
){

    return new Promise((resolve)=>{

        const img = new Image();

        img.onload = async ()=>{

            const processed =
                preprocessImage(img);

            const result =
                await Tesseract.recognize(
                    processed,
                    'kor+eng',
                    {
                        logger:m=>{}
                    }
                );

            const text =
                result.data.text;

            document.getElementById('rawText')
                .innerText +=
                '\n================\n' +
                text;

            const lines =
                text.split('\n');

            for(let rawLine of lines){

                let line =
                    rawLine.trim();

                if(line.length < 2){
                    continue;
                }

                if(
                    shouldExclude(
                        line,
                        excludeRules
                    )
                ){
                    continue;
                }

                const quantity =
                    detectQuantity(line);

                if(quantity === 0){
                    continue;
                }

                const color =
                    detectColor(line);

                const size =
                    detectSize(line);

                const productName =
                    extractProductName(
                        line,
                        color,
                        size
                    );

                if(productName.length < 2){
                    continue;
                }

                const key =
                    `${productName}|${color}|${size}`;

                if(!resultMap[key]){

                    resultMap[key] = {
                        name:productName,
                        color,
                        size,
                        quantity:0
                    };
                }

                resultMap[key].quantity +=
                    quantity;
            }

            resolve();
        };

        img.src = imageSource;
    });
}

async function startOCR(){

    const status =
        document.getElementById('status');

    document.getElementById('rawText')
        .innerText = '';

    const excludeRules =
        document.getElementById('excludeWords')
        .value
        .split('\n');

    const resultMap = {};

    const files =
        document.getElementById('imageInput')
        .files;

    let total =
        capturedImages.length +
        files.length;

    let current = 1;

    for(const image of capturedImages){

        status.innerText =
            `OCR ${current}/${total}`;

        await runOCR(
            image,
            resultMap,
            excludeRules
        );

        current++;
    }

    for(const file of files){

        status.innerText =
            `OCR ${current}/${total}`;

        const imageURL =
            URL.createObjectURL(file);

        await runOCR(
            imageURL,
            resultMap,
            excludeRules
        );

        current++;
    }

    renderTable(resultMap);

    status.innerText = '완료';
}

function renderTable(data){

    const tbody =
        document.querySelector(
            '#resultTable tbody'
        );

    tbody.innerHTML = '';

    let copyText = '';

    Object.values(data).forEach(item=>{

        const tr =
            document.createElement('tr');

        tr.innerHTML = `
        <td>
            <input class="editInput"
            value="${item.name}">
        </td>

        <td>
            <input class="editInput"
            value="${item.color}">
        </td>

        <td>
            <input class="editInput"
            value="${item.size}">
        </td>

        <td>
            <input class="editInput"
            value="${item.quantity}">
        </td>
        `;

        tbody.appendChild(tr);

        copyText +=
            `${item.name}\t${item.color}\t${item.size}\t${item.quantity}\n`;
    });

    document.getElementById('copyText')
        .value = copyText;
}

function copyResult(){

    const rows =
        document.querySelectorAll(
            '#resultTable tbody tr'
        );

    let result = '';

    rows.forEach(row=>{

        const inputs =
            row.querySelectorAll('input');

        result +=
            `${inputs[0].value}\t` +
            `${inputs[1].value}\t` +
            `${inputs[2].value}\t` +
            `${inputs[3].value}\n`;
    });

    navigator.clipboard.writeText(result);

    alert('복사 완료');
}

</script>

</body>
</html>
