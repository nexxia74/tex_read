<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>영수증 OCR 상품 집계기</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    font-family:Arial;
    margin:0;
    padding:20px;
    background:#f3f4f6;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:10px;
    margin-top:10px;
}

textarea{
    width:100%;
    height:120px;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>영수증 OCR 상품 집계기</h1>

<input type="file" id="imageInput" multiple accept="image/*">

<h3>제외 단어</h3>

<textarea id="excludeWords">부가세
택배비
배송비
합계</textarea>

<button onclick="startOCR()">OCR 시작</button>

<div id="status"></div>

<table>
<thead>
<tr>
<th>품명</th>
<th>색상</th>
<th>사이즈</th>
<th>총수량</th>
</tr>
</thead>
<tbody id="resultBody"></tbody>
</table>

<h3>복사용 결과</h3>

<textarea id="copyText"></textarea>

<button onclick="copyResult()">결과 복사</button>

</div>

<script>
const COLORS = [
'블랙','화이트','그레이','차콜','네이비',
'핑크','레드','카키','브라운'
];

const SIZES = [
'FREE','XS','S','M','L','XL',
'90','95','100','105','110'
];

async function startOCR(){

    const files = document.getElementById('imageInput').files;

    const excludeRules =
        document.getElementById('excludeWords')
        .value
        .split('\n');

    const resultMap = {};

    for(const file of files){

        document.getElementById('status').innerText =
            `${file.name} OCR 진행 중`;

        const result = await Tesseract.recognize(
            file,
            'kor+eng'
        );

        const text = result.data.text;

        const lines = text.split('\n');

        for(let line of lines){

            line = line.trim();

            if(line.length < 2) continue;

            let excluded = false;

            for(const word of excludeRules){
                if(line.includes(word)){
                    excluded = true;
                }
            }

            if(excluded) continue;

            let color = '';

            for(const c of COLORS){
                if(line.includes(c)){
                    color = c;
                }
            }

            let size = '';

            for(const s of SIZES){
                if(line.includes(s)){
                    size = s;
                }
            }

            const qtyMatch = line.match(/(\d+)$/);

            let qty = 1;

            if(qtyMatch){
                qty = parseInt(qtyMatch[1]);
            }

            let name = line;

            if(color){
                name = name.replace(color,'');
            }

            if(size){
                name = name.replace(size,'');
            }

            name = name.replace(/\d+$/,'').trim();

            if(name.length < 2) continue;

            const key = `${name}|${color}|${size}`;

            if(!resultMap[key]){
                resultMap[key] = {
                    name,
                    color,
                    size,
                    qty:0
                };
            }

            resultMap[key].qty += qty;
        }
    }

    renderTable(resultMap);

    document.getElementById('status').innerText =
        '완료';
}

function renderTable(data){

    const body =
        document.getElementById('resultBody');

    body.innerHTML = '';

    let copyText = '';

    Object.values(data).forEach(item=>{

        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${item.name}</td>
            <td>${item.color}</td>
            <td>${item.size}</td>
            <td>${item.qty}</td>
        `;

        body.appendChild(tr);

        copyText +=
            `${item.name}\t${item.color}\t${item.size}\t${item.qty}\n`;
    });

    document.getElementById('copyText').value =
        copyText;
}

function copyResult(){

    navigator.clipboard.writeText(
        document.getElementById('copyText').value
    );

    alert('복사 완료');
}
</script>

</body>
</html>
